apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: neo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Image Updater will rewrite k8s/kustomization.yaml in the neo repo
    # whenever ghcr.io/yakshith15/neo:latest gets a new digest.
    argocd-image-updater.argoproj.io/image-list: neo=ghcr.io/yakshith15/neo:latest
    argocd-image-updater.argoproj.io/neo.update-strategy: digest
    # GHCR package is private — Image Updater needs the same pull secret
    # the deployment uses (in the `neo` namespace) to fetch the tag list.
    # Without this, all tag/digest polls 401 silently.
    argocd-image-updater.argoproj.io/neo.pull-secret: pullsecret:neo/ghcr-pull-secret
    argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/argocd-image-updater-secret
    argocd-image-updater.argoproj.io/git-branch: main
spec:
  project: default
  source:
    repoURL: https://github.com/Yakshith15/neo.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: neo
  syncPolicy:
    automated:
      prune: false      # protect the PVC + Secret from accidental deletion
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Without this a sync (e.g. an Image Updater write-back) re-applies
      # replicas from git and undoes a manual scale-to-0.
      - RespectIgnoreDifferences=true
    # Don't fight us when we manually scale to 0 to save resources.
    # Argo will skip the replicas field when comparing/syncing.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
